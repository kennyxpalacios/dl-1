name: something didn't download or didn't work
description: a download failed, the app won't open, or something on the panel broke.
title: "bug: "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        thanks for taking the time. a few things first:

        - **domain only.** please don't paste private or login-only links, account names, or cookie files. if a public link shows the problem, you can mention it under "what happened."
        - **sites change.** if one site stopped working, a newer yt-dlp often fixes it. from source: `.venv/bin/python -m pip install -U yt-dlp`, then try again. the mac app carries its own yt-dlp, so those fixes arrive in a new dl-1 release.
        - **check the docs.** [troubleshooting](https://github.com/kennyxpalacios/dl-1/blob/main/docs/troubleshooting.md) covers the "can't be opened" warning, intel macs, login-only content and the common error lines. the [faq](https://github.com/kennyxpalacios/dl-1/blob/main/docs/faq.md) covers the rest.
        - **security problem?** please don't post it here. use [private vulnerability reporting](https://github.com/kennyxpalacios/dl-1/security/advisories/new) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: what happened
      description: what you pasted (site only), what you pressed, what you expected, what you got instead.
      placeholder: "pasted a link from vimeo.com, picked mp4, pressed run. the bar stopped at 40% and the log said..."
    validations:
      required: true

  - type: textarea
    id: error-line
    attributes:
      label: the error line
      description: copy the line from the panel's log display. it usually reads like "unavailable — removed, region-locked, or the link is wrong."
      render: text
    validations:
      required: true

  - type: input
    id: site
    attributes:
      label: the site
      description: domain only. no full links.
      placeholder: "e.g. vimeo.com"
    validations:
      required: true

  - type: dropdown
    id: format
    attributes:
      label: format
      options:
        - mp4
        - mp3
        - didn't get that far
    validations:
      required: true

  - type: input
    id: dl1-version
    attributes:
      label: dl-1 version
      description: the release you downloaded (e.g. v1.0). from source, the release tag or commit you're on.
      placeholder: "v1.0"
    validations:
      required: true

  - type: input
    id: ytdlp-version
    attributes:
      label: yt-dlp version
      description: shown in the panel's top bar.
      placeholder: "e.g. 2025.01.01"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: how you installed it
      options:
        - mac app (dl-1-mac.zip from releases)
        - from source, running run.sh
        - from source, app built with make_app.py
    validations:
      required: true

  - type: dropdown
    id: chip
    attributes:
      label: mac chip
      description: apple menu → about this mac.
      options:
        - apple silicon (m1 or later)
        - intel
        - not a mac
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macos version
      description: apple menu → about this mac.
      placeholder: "e.g. 14.5"
    validations:
      required: true

  - type: textarea
    id: more-log
    attributes:
      label: more of the log (optional)
      description: "mac app: ~/Library/Logs/dl-1.log. from source: the terminal output. paste only the lines around the error, and remove anything personal first: links, account names, your username in file paths."
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: before you send
      options:
        - label: i checked the troubleshooting doc and searched existing issues.
          required: true
        - label: i have the rights to download this (my own content, licensed material, or references).
          required: true
        - label: i didn't include private links, account names, or cookie files.
          required: true
